# [CGC 2026-10-06 打平 gate] 把「on 有沒有打平 off」從手算變成乾淨窗自動判的閘：
#   scripts/check/mtpon_tie_gate.py（--check / --go / --watch / --replay / --selftest）。
# 判準（唯一式子）：on 打平 off ⟺ emit_on · T_off ≥ R_on，即 gain = emit_on·T_off/R_on ≥ 1；
#   T_off = off 的 ms/token（純解碼 1 token/步）、R_on = on 的 ms/verify 輪（含 replay 輪）、
#   emit_on = emit_per_round（counter，CGC-BENCH-ACCEPT）。兩側**同 session**（AB 與 BA 各一跑序），
#   gain_bal = 兩跑序的幾何平均，margin = max(--margin-min 2%, 本 session 的跑序散度)
#   ⇒ 跑序效應與時代差都在式子裡被吸收（不再跨 session 抓數字，也不寫死雜訊帶）。
# 為什麼必須同 session（本輪端到端 smoke 自己示範）：AB gain 0.9239 vs BA 0.6781，散度 31%
#   ⇒ margin 升到 0.310。單趟比值會被跑序效應讀成 ±30% 的假訊號。
# 機制閘（沿用本 charter 的驗收）：replay/rounds<10%、trim_fail=0、emit>0、每臂 rc=0、
#   無 STALL/TIMEOUT、盒閘起跑前綠（或明確 --waive-reason 留痕）；任一不過 ⇒ VOID，不給判詞。
#   閘的 exit code：0=TIE、1=SHORTFALL、2=拒跑/VOID。
# 形狀閘（本輪新發現，寫死）：⛔ n_prompt>0 一律拒收。llama-bench 把 prompt run 放在計時區**內**
