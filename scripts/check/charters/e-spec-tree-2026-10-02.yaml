#   形狀 -p32 -n128 d0 非 house cell ⇒ 只作「閘能重算手算」的見證）；t1w2_realp_{w1,w2}_pg512 → 污染
#   被閘擋下（rc=2、無 traceback）。
# 閘自身的五個 bug 全部由**實測**抓到（純函式自測看不到 CLI/程序層 ⇒ 都補了子程序回歸釘）：
#   ① --replay 載入的 metrics 沒有 tag ⇒ sessions_valid KeyError（replay 一按就炸）
#   ② --replay 是 nargs="+" ⇒ 後面的旗標被吃成 log 路徑（argparse 直接報錯）⇒ 旗標改位置無關
#   ③ 形狀污染在 replay 是**未接住的 traceback**（rc 1）而非 doc 承諾的乾淨拒收 rc=2
#   ④ --watch 的主用法（沒 waive、盒子不綠）走不到輪詢迴圈就被拒跑 ⇒「盒閘綠即跑」在主要用法下
#      不可達（doc 承諾與程式不符）；重排控制流：--watch ＝「等它綠」的授權、waive ＝「不等它綠」
#   ⑤ gate 被打斷時留下還在跑的 llama-bench（自己的行程群組）⇒ 收 INT/TERM/HUP/PIPE 一律先收子行程
