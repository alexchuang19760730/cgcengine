id: e-les-router-prefetch-2026-10-17
owner: lineI（端側推理引擎軸；qwen35moe 同構 diff）
created: 2026-10-17
axis: SSD-PREFETCH / EXPERT-CACHE / WAIT-HIDE
parent_baseline:
  - e-magi-qwen35moe-support-2026-10-14     # 同構模型（qwen35moe）支持，真實算量基準
  - e-union-cache-shrink-2026-10-14         # MTP 前瞻 union 預取（信號源不同，需協調，見下）
