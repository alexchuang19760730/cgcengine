# ── 【目標】可判定問題 ─────────────────────────────────────────────────────
question: |
  在 C17/C18 20.6-20.8 t/s 不退化（且 M1/M2/M3 bit-identical）的前提下，
  用 MTP N draft token 前瞻 union 聚合預取 + verify 前 U_c/P_commit 集合裁剪，
  能否把 per-layer expert cache 駐留需求從當前池配置收縮（目標 ≥30%，挑戰 50%），
  同時預取命中率不降、decode 吞吐不掉出 quote_gate 帶？

# ── 【注入設計】四接口 ↔ 引擎 hook 對齊表 ──────────────────────────────────
injection_map: |
  P2 樁接口            引擎真實 hook 點                              增量動作
  -------------------- -------------------------------------------- ----------------------------------------
  batch_router         build_moe_ffn 前 / verify graph 的 draft ids  對 N 個 draft token 每層跑一次 router，
                                                                     聚合前瞻 union（不進 mul_mat_id，僅預測）
  async_prefetch       prefetch_slot（bg loop, 2173-2260）           union−resident 差集批量入隊（來源加 MTP 前瞻）
  load_expert          expert_cache fill_pool_direct / slot publish  不變（複用；僅縮 pool_capacity 對照）
  verify_batch         remap leaf 前的 ids 聚合（llama-graph:2119）  U_c/P_commit 裁剪掛點：按接受概率裁 union，
                                                                     裁剪只影響預取集合，不進正確性路徑
  關鍵安全：預測/裁剪錯只浪費 IO（多預取）或 fallback 全量，**永不改 mul_mat_id 真實 ids**
  （MTP-verify race 已由 CGC_NO_PREFETCH 路徑與 prefetch_slot 的 publish-after-land 保證）。

# ── 【假設】機制 + 預期（給區間 + 依據）────────────────────────────────────
assumption: |
  1. 【P2 雙門，2026-10-14 白皮書 §6.3.1 實測】能否 h=0 由兩個可測引擎量共同決定，已修復 profile_pipeline.py
     兩處口徑（compute 攤薄 ÷Nα=6；專家字節用 GGUF 核准 1.1223MiB/個而非 2.0MiB IO 塊，W_eff=0.377=權威 0.378）：
     (a) **SSD 讀放大（首要杠杆）**：緊湊/合並按真實專家字節預取 amp=1.0 時，即使 f32 朴素 compute 179ms/輪，
         h0 已達 19.8 tok/s（補 ≈5% 駐留即過 20）；僅當每專家讀滿 2MB 塊 amp=1.82 且 compute 高才需明顯駐留
         （RAM45：179→51%、110→4%、≤95→0%）。
     (b) **每輪 compute（次要杠杆）**：f32 合成權重朴素 dispatch 實測 179.02ms/輪為上界；IQ2_S/IQ3_S 量化專家
         字節僅 f32 的 0.28×、GEMV 訪存受限，加 graph 合流預期 40–60ms/輪，待引擎實測坐實。
     (c) RAM13 保守邊界更緊（緊湊需 compute≤80ms 才 h=0，讀滿塊 ≥140ms 無解），待 Metal 多核有效帶寬實測收緊。
  2. MTP 前瞻 union 與真實 verify union 的重疊率越高，預取命中率越高；N=8、α=.75 下
     P1 模型 U12/U14 已量化（W_eff 0.378/0.454）。
  3. cache 收縮來自「union 相對於 N*topk 上限的去重」+「裁剪掉低接受概率專家」+「緊湊預取壓讀放大」，
     不是靠降低正確 verify 需要的專家（那些仍由 remap 真實路徑按需加載）。
  4. 前置測量臂 A-prof（在 A0 之後、A1 之前）：先在 llama.cpp 引擎實測「實際預取讀字節/專家（得 amp）」
     與「量化 GEMV 真實 compute/輪」，按白皮書 §6.3.1 落格確定可收縮檔位，再進 A1 union 改造。

# ── 【驗收】fail-closed 判據 ───────────────────────────────────────────────
acceptance: |
  1. 不退化（硬門檻）：注入臂 harness bench decode ∈ C18 配對 quote_gate 散布帶，
     不掉出；M1/M2/M3 bit-identical（222/222 或該 cell 既有口徑，coverage 100%、comparable=true）。
  2. 收縮：per-layer pool_capacity 可配置下調 ≥30%（挑戰 50%），其餘開關不變。
  3. 預取質量：MTP 前瞻 union 預取命中率 ≥ 現 tail-history 路徑（counter: prefetch hit/miss、
     n_prefetch/dropped，spac_dbg 同型輸出）；cache 冷啟 miss 不增。
  4. 裁剪安全：U_c/P_commit 裁剪臂與不裁剪臂 logits bit-identical（裁剪只動預取、不動 verify ids）。
  5. A/B 控制變量：固定 seed、交替順序、同 cell、reps 5、warm_skip 0；產物成對出 engine digest。
  6. falsify：任一 bit 翻臉 / decode 出帶 / 命中率下降 ⇒ 回滾該臂，回填本卡。

# ── 【臂設計】──────────────────────────────────────────────────────────────
arms:
  - A0 baseline：現 C17/C18 配置（tail-history union，pool 不縮）
  - A1 mtp-union：union 來源加 MTP 前瞻 batch-router（pool 不變，先驗命中率）
  - A2 mtp-union+shrink30：A1 + pool_capacity×0.70
  - A3 mtp-union+shrink50+prune：A1 + ×0.50 + U_c/P_commit 裁剪
  順序：A1 先證命中率（不碰 cache 大小，隔離機制），再 A2/A3 收縮（禁止一上來就縮 + 裁剪混在一起）。

