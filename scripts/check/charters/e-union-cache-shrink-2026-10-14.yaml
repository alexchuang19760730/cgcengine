#       verify 前 U_c/P_commit 集合裁剪）作為**增量**注入 demo branch 現有
#       llama.cpp CGC 引擎，在保持 C17 20.790546 t/s 不退化的前提下收縮 expert cache。
# ⚠ 方案定位：**不是獨立方案**。複用引擎已有的 expert_cache/slot_table/prefetch_slot/
#   cache_step_union 機制，只替換 union 來源（歷史→MTP 前瞻）並加裁剪掛點。
