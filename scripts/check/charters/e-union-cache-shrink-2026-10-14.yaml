# ── 【現狀】引擎已有的可複用機制（src/llama.cpp，demo branch）──────────────
existing_mechanism: |
  引擎**已有**一套 union/預取基礎，本卡不重造：
    - expert_cache（L4 分層 bounded pool，pool_capacity，llama-context.cpp:303-412）；
      wide-union 路徑 ceiling = cap*top_k = 8*8 = 64（llama-context.cpp:693-698）。
    - slot_table + remap leaf：build_moe_ffn 的 mul_mat_id 前把 expert id 映射到 slot
      （llama-graph.cpp:1573/2119-2121；llama-context.cpp:308 remap hook）。
    - cache_step_union[il]：**每層當前 step 的 union 已存在**（id 聚合跨 token）。
    - cache_tail_union[il]：per-layer 歷史窗口 union（CGC_PREFETCH_WINDOW，默認 4，1..16）。
    - prefetch_slot：非阻塞 bg 線程預取，bytes 落地後才 publish slot_table；
      LRU victim 保證不在當前 step union 內（2173-2200）。
    - SpAc EMA membership（llama_expert_cache_spac_prefetch，CGC_SPAC_*）。
    - 開關：CGC_NO_PREFETCH / CGC_PREFETCH_SRC / CGC_SERVER_MTP / CGC_EXPERT_AFFINITY。
  現狀 union 來源＝**已發生 step 的路由結果 + tail 歷史**（temporal locality，事後）；
  本卡增量＝讓 union 來源加入 **MTP verify 的 N 個 draft token 的前瞻 batch-router**（事前）。

