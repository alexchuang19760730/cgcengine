# ── 【目標】這一臂要回答的「可判定」問題 ────────────────────────────────────
question: |
  magi_native_engine 能否擴展為加載並按目標模型算量運算 qwen35moe
  （41 層混合架構 + blk.*.ffn_*_exps.weight 專家張量 + SSM/attention 批處理），
  使 P2 四接口樁（load_expert/batch_router/verify_batch/async_prefetch）在
  真實權重下輸出的四段時序（compute/RAM/SSD/serial）可作為
  llama.cpp（20 tok/s 引擎）Union 預取注入的前置機制驗證？

# ── 【假設】機制 + 預期收益（給區間、須有依據）───────────────────────────────
assumption: |
  1. llama.cpp CGC fork（src/llama.cpp，demo branch）已支持目標模型全張量
     （C17 20.79 即在其上量得）⇒ magi 只需對齊張量名與 shape 語義，無須重新發明架構。
  2. 目標模型專家張量命名為 blk.{l}.ffn_gate_exps.weight / ffn_up_exps.weight /
     ffn_down_exps.weight（GGUF 核准：gate/up=IQ2_S、down=IQ3_S、每專家 1.1223MB；
     反量化後 f32 = inter512×2048×4B = 4MB/專家）——待實測確認（可能為 exps 前綴變體）。
  3. SSM 層（31/41）沿 token 遞歸 ⇒ MTP 批量驗證有固定串行步（≤3ms/輪，R7 白皮書風險）；
     magi 樁此輪只測 compute（GEMV/router）真實算量，SSM 串行留 llama.cpp 注入後實測。
  4. Metal GEMV（batch_router_kernel + expert_gemv_kernel，moe_router.metal 已就緒）
     用合成權重即可得真實 compute_ms（算量只依 shape，與權重內容無關）——先行接入，
     真實權重加載隨後跟進。

# ── 【驗收】判據（harness fail-closed 檢查項）───────────────────────────────
acceptance: |
  1. magi_infer 加載目標模型 GGUF：41 層全掃描命中（blk.*.attn_*/ffn_*_exps.weight/
     ffn_norm/attn_norm）+ SSM 張量名解析，不 crash、exit 0。
  2. moe_profile_metal 的 compute_ms 與 llama.cpp 同算量實測同量級（±30% 內）。
  3. P2 樁在真實權重下：Union 命中率 / 四段時序 / 平均 U 輸出 JSON，與合成權重版
     偏差 ≤ 5%（機制層與權重內容解耦的證據）。
  4. 不退化：本卡不直接改 llama.cpp 引擎（注入為下一張卡 e-union-cache-shrink-*），
     C17/C18 基線讀數不受影響（重跑 harness bench 驗證同 20.6± 級）。
  5. 未完成項：SSM 串行 ≤3ms profile（llama.cpp 注入後）；metal_kernel_* 抽象 API 其餘部分。

