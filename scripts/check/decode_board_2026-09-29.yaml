            next: "① 見證<b>已經跑了</b>（2026-09-30，配對）：對照臂（同一 build、無此旗標）<b>M1/M2/M3 各 9/9</b>、答案「42」；本臂 <b>M1 0/9</b>，<b>第一格 decode 就不同</b>（argmax 198→2047）⇒ R6 的「輸出未驗」是<b>量到的</b>。② <b>換臂也已量過了：不可行</b>（五臂同場、prod-new ＋ harness bench）：四支乾淨臂全部落在 <b>91–118 ms/step</b>（`CGC_B_SCHEME=1;CGC_SLOT_TABLE_GPU=1` ＝ S1 拿掉 R6 那面，<b>紅利一毛不剩</b>＝90.9 ms），只有 S1 在 <b>49.0 ms</b> ⇒ 底<b>與 <code>CGC_SEG_BATCH</code> 不可分離</b>（<code>docs/S1_FLOOR_ARM_ATTRIB_2026-09-30.md</code>）。③ 而同一輪把機制也翻了：hook 自己的 CPU 只有 <b>6.5 ms/step</b>（162.6 µs × 40 層，用乾淨臂 <code>CGC_HOOK_SPLIT=1</code> 量的），紅利主體是<b>提交次數</b>（41 → 1，約 1.1–1.25 ms/次）⇒ 引擎要做的是<b>提交路徑</b>（把單段提交做成輸出可驗的版本，M1 就 9/9 就是驗收），不是 hook 優化。④ 不做的話就只能改端點（機制／計數器），但那回答不了「36.80 vs 49.18 ms 哪個是底」——那種情況天花板算式就繼續採較嚴的 <b>19.2</b>。⑤ 順帶：見證讀取路徑仍然缺（下面的 assert）。⑥ 修法與驗收已寫成工作項：<code>docs/R6_SEGBATCH_FIX_PLAN_2026-09-30.md</code>（§三 <b>(A) 全駐留已否證</b>——<code>layer_caps=40-40:256</code> 只涵蓋 blk.40、主幹仍是 143 槽，且全駐留需 ≈14.3 GiB、本機放不下；主路改為 §四 <b>(B) 預測＋逐層重算</b>，第一刀 <b>S2-c</b>＝把 <code>cgc_rho_capture</code> 搬出被跳過的 hook、接到單段路徑已有的讀回通道；驗收＝配對 M1 9/9，指令現成）。立項卡 <code>charters/e-s2c-rho-capture-2026-09-30.yaml</code> 已掛在本格 charter 清單。<b>2026-10-01：S2-c 補丁路線判死，補丁本身已不適用（base 漂移；三向 git apply 皆不淨）</b>——單段提交的引擎路已在三路證據下判死（見 ⑧）；X 線診斷腳手架（a9/a10、Phase 0/1 偵測、R1PROBE）已全撤；S2-c 區塊與兩根 NaN 修亦已於當晚全撤（chartered 偵測不留樹上）。⚠ 口徑：那支臂帶 <code>CGC_RHO_PROBE</code>（R5）⇒ 本卡解除的是 <b>R6</b>，不是「20+ 可引用」（R5 要等 L20-7 的價格，而它 2026-09-30 判 <code>REFUSE</code>）。⚠ 新發現的硬性正確性 bug：帶 <code>CGC_MISS_MASK=1</code> 的變體引擎吐<b>全 NaN</b>（dump 被蓋 invalid）—— 比 M1 差異嚴重，值得單獨查。⑦ <b>見證端點已機械化（2026-09-30）</b>：本格宣告 <code>counter_quote</code>（<code>tool: r6_witness</code>，指那兩份 summary）⇒ build 當場重跑判詞，「見證紅」不再是 <code>next</code> 裡的一句散文；判詞一旦變 <code>WITNESS_GREEN</code>（或 <code>REFUSE</code>），看板就紅，逼人回來重判本格。<br>⚠ <b>2026-10-01 GPU 驗證（未過）與見證臂 env 的兩個坑</b>：① <code>CGC_RHO_FILL=1</code> 下 S2-c 的 fill 會讓 dump 全 NaN（capture＋sync 安全）；② 立項卡命令多帶的 <code>CGC_SLOT_TABLE_GPU=1</code> ⇒ 那是 <b><code>CGC_SEG_BATCH</code> × <code>CGC_SLOT_TABLE_GPU</code> 的交互作用</b>（先