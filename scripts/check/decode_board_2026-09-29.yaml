    title: "L20（decode ≥20）：10 個子目標"   # 09-30：L20-10（格子判別）由另一條線加入後，這裡沒跟著改（閘門不驗標題裡的數字）
    note: "主節點 <code>exp-prodnew-decode20-g4miss</code>（S／3a／target 20.0）；其餘各掛它自己的節點。上限 <b>19.2–24.5 t/s</b> —— <b>L20 自己就壓在 20 的邊界上</b>。⚠ 2026-09-30 機檢＋實測：本層所有的 ≥20 候選（L20-1 的 27.53、以及 SPAC／P1 那支 26–27.3）<b>阻在同一道 R6</b>，而那道門<b>已經被推過一次</b>：同一 build 上對照臂 <b>9/9</b>、單次提交臂 <b>0/9</b>（第一格 decode 就不同、答案 42→16 個 1）⇒ 不是「缺一份形式見證」，是<b>這支臂的輸出真的不同</b> ⇒ 20+ 要進已認證，得靠<b>別支臂</b>或引擎把旗標修到位元等同。<br>⚠ 2026-10-01：<b>R6 引擎路三路判死</b>（R1 恢復循環不足／方案 C 全駐留 OOM／方案 (i) 提交後校正不可行，見 <code>docs/R6_PERLAYER_ENSURE_DESIGN_2026-10-01.md</code>）⇒「引擎把旗標修到位元等同」<b>劃掉</b>；SEG_BATCH 紅利（49 ms/step、27.53／19.2）<b>不得再入帳</b>——20+ 只能靠別支臂或 async 路線；<b>2026-10-01 深夜：L20-1 端點改機制</b>（提交數 41→1／ms-submit；時間底 36.33／49.0 明文判死）。<br><b>★ 2026-10-02：新增一條與 L20-1 無關的臂 —— 段邊界重疊柵欄</b>（<code>CGC_OVERLAP_FENCE</code>，建於 <code>f4306229d</code>）。<b>乾淨窗</b>的同 session 比值 <b>×1.218</b>（控制 n=3 均值 11.756／柵欄 14.318、最好 14.580；⚠ 全部 <code>attribution=swap</code> ⇒ 絕對值 <b>DIRTY、不可引用</b>）。本日把它推到<b>機制層</b>：<b>D1</b> 量出段內唯一夠大的 <b>leaf-independent</b> 工作＝<b>共享專家 6.9%</b>（<code>Backup/l201_accel/leafonly_d1/</code>）；<b>D1b</b> 量出邊界 <b>gap 中位 7.6／均值 10.4 ms/步，且 gap≈bdhook</b>（<code>Backup/l201_accel/leafonly_d1b/</code>）⇒ 落點存在。<b>10-03 措辭更正</b>：該 <code>gap</code> 在 <code>CGC_GPU_TIMING</code> 同口徑下已判為 <b>host CPU</b>（<code>gap</code> 16.54 ms 的 CPU 部分＝hook 6.88＋submit 3.70＝10.58 ms，正是 overlap fence 收割的量；殘餘 <code>gap_not_cpu</code> ≈ 6.0 ms 為 host 自旋）⇒ <b>「GPU 空轉」標籤作廢，改稱「段邊界縫（host CPU）」</b>（<code>Backup/spec_tree/WAIT_ATTRIBUTION_2026-10-03.md</code>）。<b>D2</b>（切點拆分 <code>CGC_LEAF_SPLIT</code>）已實作，<b>D5 兩趟 PASS</b>（<code>leafonly-d2-ctl</code>／<code>leafonly-d2-split</code>：M1/M2/M3 9/9、<code>config_diffs=[]</code>）⇒ 逐位元等同；但<b>本日的量測判 <code>UNDECIDABLE</code></b>——配對差 <b>−0.29 t/s</b>、臂內散布 ±0.5–0.8、臂序漂移 +0.9 t/s（<code>Backup/l201_accel/leafonly_d2x/</code>，4 趟全 <code>attribution=both</code>）⇒ <b>效應小於窗口雜訊</b>，待<b>重開機後的乾淨窗</b>重做（並同時看 <code>gap</code> 有無下降）。<b>本臂不改值</b>，但<b>沒有一格是 ≥20／≥25 的達成</b>。<br><b>★ 同日 16:5x 機制見證 → 判詞更新：D2 判不划算（淨負），不再只是「未決」</b>（純列印見證：DECPROF 行加 <code>splits=</code>；<code>Backup/l201_accel/leafonly_d2w/</code>，D5 PASS）。同批同 step 對照：<code>splits=</code> 在 fence-only 臂為 <b>0</b>、在 fence+D2 臂 <b>13845→14781 遞增</b> ⇒ <b>治療確實施加了</b>；但 <code>submit</code> 由 3.1–3.7 漲到 <b>9.0–23.9 ms/步</b>（41 個邊界各多一次 <code>graph_compute</code>，每邊界 ≈ +130 µs）⇒ <b>代價已超過共享專家的 6.9%（≈5.5 ms/步）</b>。<b>更關鍵：D2 的機制前提是錯的</b> —— §9.2 的 <code>gap</code>（7.6／10.4 ms/步）是在<b>未開柵欄</b>的路徑上量的，而<b>柵欄的工作就是填掉那段空轉</b>（×1.218 正是它的來源）⇒ 對已開柵欄的段再拆<b>沒有落點可吃</b>。<br>⚠ <b>順手揭露的儀器限制</b>：<code>CGC_GPU_TIMING</code> 的 <code>gap</code>／<code>gpu_busy_sum</code> 在<b>開柵欄時失效</b>（fence on 的 GPUTIME 行是 <code>segs=1 skipped=351 skip_nc=351</code>，fence off 是 <code>segs=40 skipped=5</code>）：該儀表在 hook 裡讀 <code>ctx-&gt;cmd_bufs[]</code>，其前提「seg i+1 還沒提交」正是柵欄會破壞的那一條⇒ <b>開柵欄後不得再引用這些欄位</b>。這與 leaf-split 無關，是柵欄本身的既有代價。<br>⇒ <b>本軸收束：柵欄 ×1.218 是已量到的上限；leaf-only 精細化無效（機制已定位）。</b>要再往上只能走 <b>S1（裝置端算 leaf，消滅 host round-trip）</b>——那是消滅不是重疊，且與本軸可相加。"
