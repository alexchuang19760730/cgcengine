e> <b>1.007</b>（0.790／1.195）⇒ <b>40×＝37.5／40.3 ms</b>（紅利 50.3 的 74–80%，±50% 帶內）⇒ 提交路徑＝紅利主體。⚠ 本場 <code>attribution=both</code>（HEAVY／swap +1475 MiB）⇒ t/s 一律不引用；S1 臂 t/s 本場異常（9.49 vs 8.82；歷史 20.39 vs 10.07）⇒ 紅利未重現、判詞只依計數器；S1 臂 0 行 DECPROF（按設計未武裝）。證據 <code>Backup/l201_submitpath_2026-10-01/twoarm.json</code>；後續（待 operator）＝另立卡：在不開 <code>CGC_SEG_BATCH</code> 的可驗臂上減提交數。"
