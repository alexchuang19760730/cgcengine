  - {id: exp-cgc-edge0gguf-2026-10-05, kind: settled, why: "<b>不適用軸、無樣本（2026-10-05）</b>：跨 checkpoint 探針 —— 把 CGC 引擎（<code>prod-new</code> 交付格、8 GiB 池、無 MTP）指到 <code>models/gguf/Edge0-35B-Q4_0.gguf</code>（同 base Qwen3.5-MoE 35B A3B 的另一個容器，18.19 GiB、top-8、無 <code>nextn</code> head）。<br><b>① 交付口徑（<code>load_mode none</code>）</b>：host 靜態需求 <b>26,822</b> MiB（model resident <b>18,630</b> ＋ pool 8,192）vs 實體 16,384 ⇒ <b>超訂 10,438 MiB</b> ⇒ budget gate 拒跑（MEASUREMENT_CONTRACT §3.4.1，rc=2）。<br><b>② <code>mmap</code></b>：host 預檢<b>過關</b>（resident 0 ⇒ 8,192 MiB），但直呼 llama-bench 的診斷跑<b>連第一個 prefill 都沒過</b>：<code>Insufficient Memory (kIOGPUCommandBufferCallbackErrorOutOfMemory)</code> ＋ <code>CGC-METAL-FAIL</code>，死在 <code>il=39</code>、RSS ≈ 9,127 MiB。⇒ <b>mmap 讓 host 過關、卻讓 Metal 工作集爆掉</b>（＝ L25-1 的反證在另一模型上<b>第二次被量到</b>）。<br><b>③ 縮池＋縮 -ub</b>（<code>mmap</code> ＋ pool <b>4 GiB</b>（60 槽）＋ <code>-ub 256</code>）：<b>同一種失敗、同一個爆點</b>（<code>kIOGPUCommandBufferCallbackErrorOutOfMemory</code>／<code>compute #41</code>，死於 prefill 最後一層 <code>il=39</code>），RSS 僅 5,020 MiB ⇒ <b>池與 -ub 都不是綁定約束</b>（各砍半、爆點不動）。<br>⇒ <b>判詞：這顆 checkpoint（18.19 GiB）在 16 GB／M4（GPU 預算 11.45 GB）上沒有可跑的形狀</b> —— <code>none</code> 死在 host 算術（模型 18,630 ＞ 16,384，池再小都救不了）、<code>mmap</code> 死在 GPU，且 GPU 那條對 pool／ubatch <b>不敏感</b>。⇒「CGC × 這顆 checkpoint 能跑多少速度」在此硬體上<b>不存在答案</b>；剩下只有換盒、或換 ≤ 約 Nail 尺寸（12.72 GiB）的 checkpoint。<br>★ 儀器缺口（已驗）：<b>budget gate 對 <code>CGC_SERVER_MODEL</code> 是盲的</b> —— <code>llama_bench_matrix.py:1630</code> 只用 <code>resolve()[\"env\"]</code>，而該 env <b>既無 <code>MODEL</code> 也無 <code>CGC_SERVER_MODEL</code></b>（模型只進 argv 的 <code>-m</code>）⇒ <code>budget_gate.sh:12</code> 落到硬編碼 Nail 預設（本趟報 model 13030 ＝ Nail 13,030.1，真值 18,630.6）⇒ <b>換更大的 checkpoint 會低估超訂量</b>（危險方向：可能放行其實超訂的臂）。<br>charter scripts/check/charters/exp-cgc-edge0gguf-2026-10-05.yaml；產物 <code>Backup/spec_tree/cgc_edge0gguf_2026-10-05/mmap_bench.{json,log}</code> ＋ <code>mmap4g_bench.{json,log}</code>（兩份 json 皆 <code>[]</code>）"}
  - {id: exp-spectree-mtpon-default-2026-10-06, kind: settled, why: "spec-tree MTP-on vs off，<b>(default) 格</b>＋採樣口徑（temp=0.4）＋seed=1，<b>兩臂同 denseIQ4X 模型</b>。ON tg <b>6.15</b> vs OFF <b>10.38</b> t/s（＝<b>×0.592</b>，−40.8%；s04 重製 ×0.503）⇒ <b>spec-tree MTP 在 16 GB 盒是 decode 淨回歸</b>：draft_ratio 0.708、mean_len 2.42、X&lt;Y=8（alt_branch 機制可用）。⛔<b>但原因已更正（2026-10-06）</b>：不是「cache hit 96%→35% / swap 抖動」—— on 的 35.2% 是 selective-fill 的<b>冷集分母</b>（同批<b>聯合覆蓋率 on 97.2% &gt; off 96.1%</b>），且 rs0 已 caliber_certify <b>REFUSED</b> ⇒ 不可引用 —— 而是<b>兩條可從日誌重算的帳</b>：① verify <b>6 列/輪</b>（≈3.05 token 當量；3 列步只要 0.437–0.510×）② 寬-2 樹的<b>第二個 draft token 命中 0.253</b>（3 列鏈 0.749）⇒ emit <b>1.954 vs 2.381</b>。<b>同 session 三臂（off → on → on+rgate → off）</b>：<b>9.85 → 6.43 → 10.48 → 11.26</b> t/s ⇒ on/off <b>0.63×</b>、gated/off <b>0.97×</b>（貼線、<b>未證明過線</b>；off 錨 8 分鐘內漂 +14%）。caliber_certify <b>REFUSED</b> 兩臂（attrib=both、thermal HEAVY、spread&gt;1.10）⇒ 超訂不可引用、不入 ratchet、不入 C15。結論＝「機制成功、交付不 advance」，與 L25-4 k 軸經濟學 DEAD 同判。產物 Backup/spec_tree/rs0_sampling/{sp_mtpon_off_s05,sp_mtpon_on_s05}.json。**★ post-B-fix 重測（2026-10-06 15:27・Backup/spec_tree/rs1_paired_cert/pair.json）**：speculative.cpp draft() 加 self-correct clamp 後，on 臂 X&lt;Y=0（pre-fix 8 殺光 draft）、spec-tree draft 5/5 rep（drafted 98–124/round、emit 2.06–2.61、acc 66–79）⇒ draft 機制恢復；on 7.838 / off 8.415 ＝ <b>0.931×</b>（pre-fix 0.592× 因 X&lt;Y 殺光 draft，現已持平）。結論不變：機制成功、交付不 advance。"}
